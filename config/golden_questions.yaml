# Golden question set: DRAFT for the maintainer's review (written 2026-11-27).
#
# Basis: the Help Scout Docs report for 2025-11-01 to 2026-10-31 (top articles by views and
# the popular searches). The report lists articles, not questions, so each question below
# is written the way a colleague would ask it, NOT copied from the article title (a title
# would find its own page too easily). Required facts are taken from the stored article
# text, so a reviewer can check them against the source.
#
# This is the first part of the QUAL-001 calibration set and the real-question set that
# SYNC-013 asks for. It is not wired to any command yet. Nothing has been run against it.
#
# Fields
#   id              stable key, never reused
#   question        what is asked
#   product         hydrosym | hydroman | hydrocam
#   form            procedure | factual | keyword | not_in_kb
#   basis           the report line this comes from, with its views (or search count)
#   expect          sources that answer it; at least one should be retrieved
#   required_facts  what a good answer must contain (empty for not_in_kb)
#   video           optional: the video whose chunks are the thing under test. A question counts
#                   as a video hit only if a chunk of this video is retrieved (the KB article
#                   in `expect` may answer it too)
#   review          open = the maintainer has not looked at it yet
#
# Basis, second report: Docs Report 2026-06-01 to 2026-11-26 (171 articles, the same count
# as the collection), used for G37 to G45.
#
# Not included, because their stored text is only screenshot descriptions so no facts can
# be checked against it: "Tutorial: Export form Hydroman to Solid Works". "Quick Start" is
# ambiguous (HydroSym or HydroMan); say which. "Tutorial: Getting started" is read as the
# HydroSym article (G42); say if the HydroMan one was meant.

questions:
  - id: G01
    question: "Some elements in my schematic ended up off the grid after I switched snap off. How do I get them back on it?"
    product: hydrosym
    form: procedure
    basis: "Keep your designs neat and precise: grid, snap and ortho (916 views, the most viewed article)"
    expect:
      - https://hydrosym.paro.nl/article/469-grid-snap-and-ortho
      - https://www.youtube.com/watch?v=QFhxj3JQTMA
    required_facts:
      - "use the align function"
      - "select the reference port that is on the grid first, then the port that is out of line"
      - "right click and choose Align Y (shortcut Y) for the Y axis"
    review: open

  - id: G02
    question: "Can HydroSym make a PDF of the drawing by itself when I close it?"
    product: hydrosym
    form: procedure
    basis: "Automatically generate PDFs (416 views)"
    expect:
      - https://hydrosym.paro.nl/article/460-automatically-generate-pdfs
    required_facts:
      - "Tools > Preferences, Misc tab, enable 'Autosave .pdf when closing diagram files'"
      - "restart HydroSym afterwards"
      - "the PDF is saved in the same folder under the same name as the diagram"
      - "closing the file takes longer because the PDF is generated"
    review: open

  - id: G03
    question: "Our PLM system keeps the part attributes in XML. How does HydroSym pick them up?"
    product: hydrosym
    form: factual
    basis: "Project attribute exchange through XML (397 views)"
    expect:
      - https://hydrosym.paro.nl/article/461-project-attribute-exchange-through-xml
    required_facts:
      - "by default HydroSym looks for an XML file with the same name in the same folder as the diagram"
      - "a fixed path for the XML file can be configured"
      - "the node in the XML tree that holds the attributes can be set"
      - "HydroSym attribute names can be mapped to the PDM/PLM attribute names"
    review: open

  - id: G04
    question: "Can HydroSym be connected to our PDM or PLM workflow, and where do I start?"
    product: hydrosym
    form: factual
    basis: "Integrating with other software (363 views) and the integration article it links to"
    expect:
      - https://hydrosym.paro.nl/article/374-integrating-with-other-software-hydrosym-documentation-paro-software
      - https://hydrosym.paro.nl/article/359-how-do-i-set-up-an-integration
    required_facts:
      - "generic methods exist: shared configuration, automatic generation of drawing PDFs, project attribute exchange"
      - "custom integrations are also done for customers"
      - "contact info@paro.nl; a call to understand the setup comes first"
    review: open

  - id: G05
    question: "How do I make a cavity in HydroMan so that the steps nobody should change are locked?"
    product: hydroman
    form: procedure
    basis: "Tutorial: How to create a cavity in Hydroman (360 views, up 17,900%)"
    expect:
      - https://hydroman.paro.nl/article/279-tutorialsusagecreating-cavities
    required_facts:
      - "select the cavity, press A and select the steps to hide in the drilling list, then check 'Hidden'"
      - "hidden steps cannot be changed while creating a manifold; they are greyed out in the Change Hole(s) menu"
      - "they can still be changed by unchecking 'Lock Hidden Diameters', with extreme caution"
      - "the cavity must match the manufacturer's detail drawing"
    review: open

  - id: G06
    question: "A cavity has a locating shoulder. Where do I mark it and what does it mean?"
    product: hydroman
    form: factual
    basis: "Tutorial: How to create a cavity in Hydroman (360 views)"
    expect:
      - https://hydroman.paro.nl/article/279-tutorialsusagecreating-cavities
    required_facts:
      - "check the step that is the locating shoulder (LS) in the Hole Attributes menu"
      - "it is the step the cavity is dimensioned from (zero depth in the datasheet), usually the top spotface"
      - "if it is hidden in the drilling list, a remark like 'LS=0,8' is added to the shown step"
    review: open

  - id: G07
    question: "The hole numbers and item numbers overlap in my drawing. How do I move them?"
    product: hydroman
    form: procedure
    basis: "Tutorial: How to move text, itemnumbers of a hole or cavity (314 views, up 31,300%)"
    expect:
      - https://hydroman.paro.nl/article/272-tutorialsusagemoving-text-from-holes-and-cavities
    required_facts:
      - "hole text: right click and Drag Hole Text (shortcut H); the spacebar rotates the text"
      - "item number: Drag Item Number (shortcut U)"
      - "hole number position: Move Hole Number Position (shortcut J), after giving a fixed height"
    review: open

  - id: G08
    question: "How do I engrave the item number of a cavity?"
    product: hydroman
    form: procedure
    basis: "Tutorial: How to move text, itemnumbers of a hole or cavity (314 views)"
    expect:
      - https://hydroman.paro.nl/article/272-tutorialsusagemoving-text-from-holes-and-cavities
    required_facts:
      - "select the hole or cavity and choose Engrave number (Shift+U)"
      - "mark the box in front of the text and press OK"
      - "size and type of the engraving are formatted under Assist; the default equals the hole text settings"
    review: open

  - id: G09
    question: "How do I make an undercut in a hole in HydroMan?"
    product: hydroman
    form: procedure
    basis: "Tutorial: How to make an undercut in Hydroman (305 views, up 15,150%)"
    expect:
      - https://hydroman.paro.nl/article/271-tutorialsusagemaking-an-undercut
    required_facts:
      - "add two steps to the hole and give them the wanted diameter and depth"
      - "select the hole, press A, select steps 1.2 and 1.3 (Ctrl for several) and mark 'Spotfaced'"
      - "a cross section in the Y axis shows what changes"
    review: open

