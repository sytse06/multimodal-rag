[project]
name = "multimodal-rag"
version = "0.1.0"
description = "RAG-powered support knowledge base with video timestamp citations"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gradio>=6.0,<7",
    "langchain-core>=1.2,<2",
    "langchain-google-genai>=4.0,<5",
    "langchain-ollama>=1.0,<2",
    "langchain-openai>=1.1,<2",
    "langchain-openrouter>=0.1,<1",
    "weaviate-client>=4.0.0",
    "youtube-transcript-api>=1.0.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "firecrawl-py>=1.0.0",
    "pyyaml>=6.0.0",
    "mistralai>=1.12.3",
    "yt-dlp>=2026.3.13",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
lint.select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
no_implicit_reexport = true
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests requiring network access"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]
