services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.13
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"

  # The embedding runtime, pinned to the version production builds with (ARG
  # OLLAMA_VERSION in the Dockerfile; tests/test_ollama_pin.py keeps them equal). The
  # Mac app auto-updates and changed the vectors once already, so documents are embedded
  # here, on 11435, never on the app's 11434. Start it with `make ollama-up`.
  ollama:
    image: ollama/ollama:0.40.14
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  # A throwaway copy of the hosted collection to rehearse a promotion and its rollback
  # on, off production. Seed it from a hosted backup (make rehearsal-seed).
  weaviate-rehearsal:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.13
    profiles: ["rehearsal"]
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50052:50051"
    volumes:
      - weaviate_rehearsal_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"

volumes:
  weaviate_data:
  ollama_data:
  weaviate_rehearsal_data:
